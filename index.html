<!DOCTYPE html>
<html lang="en">

    <title>Ecobazar</title>
    <!-- GOOGLE FONT START -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="src/all.min.css">

<body>
    <!--TOP HEADER PART START -->
    <div class=" py-6 border-b border-[#cccccc]">
        <div class="max-w-mContainer m-auto">
            <div class="flex justify-between items-center font-pop">
                <div class="flex justify-between items-center gap-2 text-topHead">
                    <i class="fa-solid fa-location-dot"></i>
                    <p>Store Location: Lincoln- 344, Illinois, Chicago, USA</p>
                </div>
                <div class="text-topHead">
                    <a href="#" class="mr-2">Eng<i class="fa-solid fa-chevron-down"></i></a>
                    <a href="#">USD<i class="fa-solid fa-chevron-down"></i></a>
                    <span class="mx-3">|</span>
                    <a href="#">Sign In</a>
                    <span class="mx-2">\</span>
                    <a href="#">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
    <!--TOP HEADER PART END -->
    <!--MID HEADER PART START -->
    <div class="py-7">

            <div class="flex justify-between items-center">
                <div class="">

                </div>
                <div class="flex justify-between items-center relative">
                    <input type="text" placeholder="Search"
                        class="w-100 border border-[#cccccc] py-3 px-4 rounded-[10px]">
                    <button
                        class="text-[14px] font-semibold font-pop text-white bg-[#00B207] py-3.5 px-4 rounded-r-[10px] absolute top-0 right-0">Search</button>
                        <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <div class="flex justify-between items-center gap-2">
                    <div class="flex justify-between items-center relative">
                        <i class="fa-regular fa-heart text-[24px]"></i>
                        <span class="mx-3">|</span>
                        <i class="fa-solid fa-bag-shopping text-[24px]"></i>
                        <div class="bg-[#2C742F] h-4 w-4 rounded-full absolute -top-1.25 -right-1.25 ">
                            <h4 class=" text-[10px] font-medium font-pop text-white absolute top-1/2 left-1/2 -translate-1/2">2</h4>
                        </div>
                    </div>
                    <div class="">
                        <h3 class="text-[#4d4d4d] text-[11px] font-pop">Shopping cart:</h3>
                        <h4 class="font-pop text-[14px] font-medium">$57.00</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--MID HEADER PART END -->
    <!-- NAVBAR START -->
    <div class="py-12.5 bg-[#333]">
        <div class="max-w-mContainer m-auto">
            <div class="flex items-center justify-between">
                <div class="">
                    <ul class="flex items-center justify-between gap-4 text-topHead">
                        <li><a href="#" class="hover:text-white">Home<i class="fa-solid fa-chevron-down mx-1"></i></a></li>
                        <li><a href="#" class="hover:text-white">Shop<i class="fa-solid fa-chevron-down mx-1"></i></a></li>
                        <li><a href="#" class="hover:text-white">Pages<i class="fa-solid fa-chevron-down mx-1"></i></a></li>
                        <li><a href="#" class="hover:text-white">Blog<i class="fa-solid fa-chevron-down mx-1"></i></a></li>
                        <li><a href="#" class="hover:text-white">About Us</a></li>
                        <li><a href="#" class="hover:text-white">Contact Us</a></li>
                    </ul>

                    <i class="fa-solid fa-phone-volume text-[28px]"></i>
                    <span class="font-pop text-[14px] font-medium">(219) 555-0114</span>
                </div>
            </div>
        </div>
    </div>
    <!-- NAVBAR END -->

    <div class="py-5">
        <div class="max-w-mContainer m-auto">
            <div class="flex justify-between gap-3 bg-[#999]">

                    <a href="#">
                        <img src="images/BannarOne.png" alt="BannarOne" class="w-full h-full">
                    </a>
                </div>
                <div class="w-[40%]">
                    <div class="">
                        <a href="#">
                            <img src="images/BannarTwo.png" alt="BannarTwo.png" class="w-full h-full">
                        </a>
                    </div>
                    <div class="mt-2">
                        <a href="#">
                            <img src="images/BannarThree.png" alt="BannarThree.png" class="mt-3 w-full h-full">
                        </a>
                    </div>
                </div>
            </div>
        </div>
